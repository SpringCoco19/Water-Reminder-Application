
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Water Reminder App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HOME SCREEN -->
    <div id="homeScreen">

        <!-- HOME BACKGROUND -->
        <img class="home-background"
             src="assets/background.png"
             alt="Home Background">

        <p>Water Reminder App</p>

        <!-- START BUTTON -->
        <button id="openTimer" class="image-button">
            <img src="assets/StartTimer.png" alt="Start Timer">
        </button>

    </div>


    <!-- TIMER SCREEN -->
    <div id="timerScreen" style="display: none;">

        <!-- TIMER BACKGROUND -->
        <img class="timer-background"
             src="assets/background.png"
             alt="Timer Background">

        <h2>Water Timer 💧</h2>

        <div id="timer">39:00</div>

        <button id="startButton">START</button>

        <button id="resetButton">RESET</button>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
